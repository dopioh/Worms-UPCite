image: maven:3.9-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dhttps.proxyHost=194.254.199.96 -Dhttps.proxyPort=3128"
  MAVEN_CONFIG: "/root/.m2"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

before_script:
  - mkdir -p /root/.m2
  - echo '<settings>
      <proxies>
        <proxy>
          <id>proxy</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>' > /root/.m2/settings.xml

stages:
  - build
  - test
  - deploy

# ETAPE 1 : BUILD

build:
  stage: build
  script: 
    - cd worms
    - mvn $MAVEN_CLI_OPTS clean compile
#  cache:
#    key: "$CI_COMMIT_REF_NAME"
#    policy: push
  artifacts:
    paths:
      - worms/target

# ETAPE 2 : TEST 

test:
  stage: test
  script: 
    - cd worms
    - mvn $MAVEN_CLI_OPTS test
  
  dependencies :
    - build

# ETAPE 3 : DEPLOIEMENT

deploy:
  stage: deploy
  script:
    - cd worms
    - mvn $MAVEN_CLI_OPTS clean package
  artifacts:
    paths:
      - worms/target/*.jar
