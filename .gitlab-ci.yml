image: maven:3.9-eclipse-temurin-23

variables:
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  # Repo Maven local DANS le projet (pour être caché)
  MAVEN_REPO_LOCAL: "$CI_PROJECT_DIR/worms/.m2/repository"

cache:
  key: "maven-cache"
  paths:
    - worms/.m2/repository

before_script:
  - mkdir -p "$CI_PROJECT_DIR/worms/.m2"
  # Si vous avez BESOIN du proxy sur certains runners (école) :
  - |
    cat > "$CI_PROJECT_DIR/worms/.m2/settings.xml" << 'EOF'
    <settings>
      <proxies>
        <proxy>
          <id>proxy</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>
    EOF

stages:
  - build
  - test
  - deploy
  - release_job

build:
  stage: build
  script:
    - cd worms
    - mvn $MAVEN_CLI_OPTS -s "$CI_PROJECT_DIR/worms/.m2/settings.xml" -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -U clean compile
  artifacts:
    paths:
      - worms/target

test:
  stage: test
  script:
    - cd worms
    - mvn $MAVEN_CLI_OPTS -s "$CI_PROJECT_DIR/worms/.m2/settings.xml" -Dmaven.repo.local="$MAVEN_REPO_LOCAL" test
  dependencies:
    - build

deploy:
  stage: deploy
  script:
    - cd worms
    - mvn $MAVEN_CLI_OPTS -s "$CI_PROJECT_DIR/worms/.m2/settings.xml" -Dmaven.repo.local="$MAVEN_REPO_LOCAL" clean package
  artifacts:
    paths:
      - worms/target/worms-app.jar
    expire_in: 1 week
  only:
    - main
    - dev
    - deploiement
    - tags
    - fixRelease

release_job:
  stage: release_job
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: deploy
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Création de la release pour le tag $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release automatique générée par le CI'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'worms-app.jar'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/worms/target/worms-app.jar?job=deploy'
