#          <port>3128</port>
#        </proxy>
#      </proxies>
#    </settings>' > /root/.m2/settings.xml

stages:
  - build
  - test
  - deploy
  - release_job

# ETAPE 1 : BUILD - Teste sur plusieurs versions de Java et maven
# Pas besoin de tester les architectures ici (Le bytecode Java peut fonctionner sur differents systemes sans etre modifie)

build:
  stage: build
  parallel:
    matrix:
      - JAVA_VERSION: ["23", "24", "25"]
        MAVEN_VERSION: ["3.8", "3.9"]
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  script: 
    # force la suppression du proxy au cas où il reste en mémoire pour proxy
    - unset MAVEN_OPTS || true
    - rm -f /root/.m2/settings.xml || true
    
    - cd worms
    - mvn $MAVEN_CLI_OPTS -U clean compile
    #  cache:
    #    key: "$CI_COMMIT_REF_NAME"
    #    policy: push

  artifacts:
    paths:
      - worms/target
    expire_in: 1 week

# ETAPE 2 : TEST - Teste sur plusieurs versions de Java, maven et architectures

test:
  stage: test
  parallel:
    matrix:
      - JAVA_VERSION: ["23", "24", "25"]
        MAVEN_VERSION: ["3.8", "3.9"]
        ARCH: ["arm64", "amd64"]
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  variables:
    DOCKER_DEFAULT_PLATFORM: linux/${ARCH}
  before_script:
    - echo "Testing on ${ARCH} architecture"
  script: 
    - cd worms
    - mvn $MAVEN_CLI_OPTS test
  
  dependencies :
    - build

# ETAPE 3 : DEPLOIEMENT - Utilise Java 23 pour le deploiement

deploy:
  stage: deploy
  image: maven:3.9-eclipse-temurin-23
  script:
    - cd worms
    - mvn $MAVEN_CLI_OPTS clean package
  artifacts:
    paths:
      - worms/target/worms-app.jar
    expire_in: 1 week
  only:
   - main 
   - dev
   - deploiement
   - tags
   - fixRelease

release_job:
  stage: release_job
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: deploy
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG 
  script:
    - echo "Création de la release pour le tag $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release automatique générée par le CI'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'worms-app.jar'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/worms/target/worms-app.jar?job=deploy'