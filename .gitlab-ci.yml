image: maven:3.9-eclipse-temurin-23

variables:
  #désactivé temporairement pour un runner secours (mac Ian)
  #MAVEN_OPTS: "-Dhttps.proxyHost=194.254.199.96 -Dhttps.proxyPort=3128"
  MAVEN_CONFIG: "/root/.m2"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

#before_script:
#  - mkdir -p /root/.m2
#  - echo '<settings>
#      <proxies>
#        <proxy>
#          <id>proxy</id>
#          <active>true</active>
#          <protocol>https</protocol>
#          <host>194.254.199.96</host>
#          <port>3128</port>
#        </proxy>
#      </proxies>
#    </settings>' > /root/.m2/settings.xml

stages:
  - build
  - test
  - deploy
  - release_job

# ETAPE 1 : BUILD

build:
  stage: build
  script: 
    # force la suppression du proxy au cas où il reste en mémoire
    - unset MAVEN_OPTS || true
    - rm -f /root/.m2/settings.xml || true
    
    - cd worms
    - mvn $MAVEN_CLI_OPTS clean compile
#  cache:
#    key: "$CI_COMMIT_REF_NAME"
#    policy: push
  artifacts:
    paths:
      - worms/target

# ETAPE 2 : TEST 

test:
  stage: test
  script: 
    - cd worms
    - mvn $MAVEN_CLI_OPTS test
  
  dependencies :
    - build

# ETAPE 3 : DEPLOIEMENT

deploy:
  stage: deploy
  script:
    - cd worms
    - mvn $MAVEN_CLI_OPTS clean package
  artifacts:
    paths:
      - worms/target/worms-app.jar
    expire_in: 1 week
  only:
   - main 
   - dev
   - deploiement
   - tags
   - fixRelease

release_job:
  stage: release_job
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: deploy
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG 
  script:
    - echo "Création de la release pour le tag $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release automatique générée par le CI'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'worms-app.jar'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/worms/target/worms-app.jar?job=deploy'